<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fecd08"/>
      <stop offset="50%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glowing background circle for contrast (optional, but good for favicon) -->
  <circle cx="50" cy="50" r="46" fill="#060c12" stroke="rgba(254, 205, 8, 0.2)" stroke-width="2"/>
  
  <!-- The Star -->
  <path d="M50 15 L60.8 36.9 L85 40.4 L67.5 57.4 L71.6 81.5 L50 70.1 L28.4 81.5 L32.5 57.4 L15 40.4 L39.2 36.9 Z" 
        fill="url(#star-grad)" 
        filter="url(#glow)"/>
</svg>
